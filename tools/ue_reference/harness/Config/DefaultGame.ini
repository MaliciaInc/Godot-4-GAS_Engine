; Evaluation channels are off by default and a refused channel collapses into
; Channel0 silently, so a scenario about two channels would measure one. Both
; sections are set: the developer settings are where 5.5+ reads this, and
; AbilitySystemGlobals is where it was read before, and which of the two answers
; is not worth guessing at.
[/Script/GameplayAbilities.GameplayAbilitiesDeveloperSettings]
bAllowGameplayModEvaluationChannels=True
GameplayModEvaluationChannelAliases[0]=Channel0
GameplayModEvaluationChannelAliases[1]=Channel1
GameplayModEvaluationChannelAliases[2]=Channel2
GameplayModEvaluationChannelAliases[3]=Channel3
GameplayModEvaluationChannelAliases[4]=Channel4
GameplayModEvaluationChannelAliases[5]=Channel5
GameplayModEvaluationChannelAliases[6]=Channel6
GameplayModEvaluationChannelAliases[7]=Channel7
GameplayModEvaluationChannelAliases[8]=Channel8
GameplayModEvaluationChannelAliases[9]=Channel9

